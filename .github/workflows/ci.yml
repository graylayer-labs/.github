name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The org lint workflow, called from this commit. Reports as
  # "checks / checks", which main requires.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-lint.yml
    with:
      # Retired or pending retirement (#18); both fail actionlint.
      actionlint-skip: code-quality.yml sync-org-standards.yml
