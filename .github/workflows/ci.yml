name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Lint workflows
        # code-quality.yml and sync-org-standards.yml fail actionlint and are
        # pending an owner decision on retiring them (see #5). Shell inside
        # workflows is not linted until then.
        run: |
          find .github/workflows -name '*.yml' \
            ! -name code-quality.yml ! -name sync-org-standards.yml -print0 \
            | xargs -0 uvx --from actionlint-py==1.7.12.25 actionlint -shellcheck=
      - name: Lint scripts
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck --severity=error scripts/*.sh
