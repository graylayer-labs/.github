name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Lint workflows
        # code-quality.yml and sync-org-standards.yml fail actionlint and are
        # pending an owner decision on retiring them (see #5). Shell inside
        # workflows is not linted until then.
        run: |
          find .github/workflows -name '*.yml' \
            ! -name code-quality.yml ! -name sync-org-standards.yml -print0 \
            | xargs -0 uvx --from actionlint-py==1.7.12.25 actionlint -shellcheck=
      - name: Lint scripts
        run: uvx --from shellcheck-py==0.11.0.1 shellcheck --severity=error scripts/*.sh

  # The org lint workflow, called from this commit. Reports as
  # "checks / checks". Runs beside the inline job above until main requires
  # "checks / checks" (#17); then the inline job is removed.
  shared:
    name: checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci-lint.yml
    with:
      # Retired or pending retirement (#18); both fail actionlint.
      actionlint-skip: code-quality.yml sync-org-standards.yml
